openapi: 3.1.0
info:
  title: Clipli API
  version: 1.0.0
  description: |
    Clipli HAPW asset, authorization, redemption, exercise, exchange and AI creation API for external partners.
    HAPW facts are read from external platform sources and returned with source and synchronization metadata.
    Authentication, deployment domain, rate limits and enabled operations are configured per integration agreement.
servers:
  - url: https://{apiHost}
    description: Deployed Clipli API base URL supplied during partner onboarding
    variables:
      apiHost:
        default: api.example.com
        description: Replace with the API hostname supplied by Clipli
tags:
  - name: System
  - name: HAPW Assets
  - name: HAPW Redemptions
  - name: HAPW Exercises
  - name: HAPW Exchanges
  - name: Creation
  - name: Account
  - name: Wallets
  - name: Airdrops
  - name: Operations
  - name: CLIP Treasury
  - name: Integrations
  - name: Compatibility
paths:
  /api/health:
    get:
      tags: [System]
      summary: Check API health
      operationId: getHealth
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, service, time]
                    properties:
                      status: { type: string, const: ok }
                      service: { type: string, const: clipli-api }
                      time: { type: string, format: date-time }

  /api/v1/hapw/summary:
    get:
      tags: [HAPW Assets]
      summary: Get HAPW portfolio summary
      operationId: getHAPWSummary
      responses:
        '200':
          description: HAPW summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HAPWSummaryEnvelope'

  /api/v1/hapw/assets:
    get:
      tags: [HAPW Assets]
      summary: List and filter HAPW assets
      operationId: listHAPWAssets
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Match ID, token ID, name or rights holder
        - name: status
          in: query
          schema: { type: string, enum: [available, redeemed, restricted] }
        - name: owner
          in: query
          schema: { type: string }
        - name: rightsHolder
          in: query
          schema: { type: string }
        - name: redeemable
          in: query
          schema: { type: boolean }
        - name: exchangeAvailable
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema: { type: string, enum: [tokenId, value, -value, issuedAt, -issuedAt] }
      responses:
        '200':
          description: Paginated HAPW assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HAPWAssetListEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/hapw/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [HAPW Assets]
      summary: Get a HAPW asset with related works and available actions
      operationId: getHAPWAsset
      responses:
        '200':
          description: HAPW asset detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HAPWAssetDetailEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hapw/assets/{assetId}/authorization:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [HAPW Assets]
      summary: Get HAPW authorization scope and provenance
      operationId: getHAPWAuthorization
      responses:
        '200':
          description: Authorization and certificate data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [assetId, tokenId, authorization, provenance]
                    properties:
                      assetId: { type: string }
                      tokenId: { type: string }
                      authorization: { $ref: '#/components/schemas/Authorization' }
                      provenance: { $ref: '#/components/schemas/Provenance' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hapw/assets/{assetId}/history:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [HAPW Assets]
      summary: Get issuance, redemption, creation, exercise and exchange history
      operationId: getHAPWHistory
      responses:
        '200':
          description: Ordered HAPW asset events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEventListEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hapw/assets/{assetId}/works:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [HAPW Assets]
      summary: List works linked to a HAPW asset
      operationId: listHAPWWorks
      responses:
        '200':
          description: Linked works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkListEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hapw/assets/{assetId}/exchange-quote:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [HAPW Exchanges]
      summary: Quote CLIP required for a reserve HAPW
      operationId: quoteHAPWExchange
      responses:
        '200':
          description: Indicative 60-second quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeQuoteEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hapw/redemptions:
    get:
      tags: [HAPW Redemptions]
      summary: List HAPW redemptions
      operationId: listHAPWRedemptions
      parameters:
        - $ref: '#/components/parameters/AssetIdQuery'
      responses:
        '200':
          description: HAPW redemptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionListEnvelope'
    post:
      tags: [HAPW Redemptions]
      summary: Irreversibly redeem HAPW and grant credits plus CLIP
      operationId: createHAPWRedemption
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedemptionRequest' }
      responses:
        '201':
          description: HAPW redeemed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionResultEnvelope' }
        '200':
          description: Existing result returned for the same requestId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/hapw/redemptions/{redemptionId}:
    parameters:
      - name: redemptionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [HAPW Redemptions]
      summary: Get a HAPW redemption receipt
      operationId: getHAPWRedemption
      responses:
        '200':
          description: Redemption receipt
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HAPWRedemption' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hapw/exercises:
    get:
      tags: [HAPW Exercises]
      summary: List third-party HAPW exercise requests
      operationId: listHAPWExercises
      parameters:
        - $ref: '#/components/parameters/AssetIdQuery'
      responses:
        '200':
          description: Exercise records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseListEnvelope' }
    post:
      tags: [HAPW Exercises]
      summary: Create a third-party HAPW exercise signing request
      operationId: createHAPWExercise
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExerciseRequest' }
      responses:
        '201':
          description: Exercise request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseEnvelope' }
        '200':
          description: Existing result returned for the same requestId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/hapw/exchanges:
    get:
      tags: [HAPW Exchanges]
      summary: List CLIP to HAPW reserve exchanges
      operationId: listHAPWExchanges
      parameters:
        - $ref: '#/components/parameters/AssetIdQuery'
      responses:
        '200':
          description: Exchange records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeListEnvelope' }
    post:
      tags: [HAPW Exchanges]
      summary: Exchange CLIP for a finite reserve HAPW
      operationId: createHAPWExchange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeRequest' }
      responses:
        '201':
          description: Exchange completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeResultEnvelope' }
        '200':
          description: Existing result returned for the same requestId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/hapw/exchange-policy:
    get:
      tags: [HAPW Exchanges]
      summary: Get daily exchange limit and reserve inventory
      operationId: getHAPWExchangePolicy
      responses:
        '200':
          description: Current UTC-day policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangePolicyEnvelope' }

  /api/v1/platforms:
    get:
      tags: [HAPW Exercises]
      summary: List supported third-party exercise platforms
      operationId: listPlatforms
      responses:
        '200':
          description: Third-party platforms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformListEnvelope' }

  /api/v1/session:
    get:
      tags: [Account]
      summary: Get the current integration session capabilities
      operationId: getSessionPolicy
      responses:
        '200':
          description: Integration session context and enabled capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }

  /api/v1/wallet/connect:
    post:
      tags: [Wallets]
      summary: Connect an EIP-1193 wallet address
      description: Stores the provider-returned address and chain metadata. Clipli never receives a private key or signs from the browser.
      operationId: connectWalletV1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletConnectRequest' }
      responses:
        '200':
          description: Updated wallet profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericDataEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Wallets]
      summary: Disconnect the current wallet
      operationId: disconnectWalletV1
      responses:
        '200':
          description: Updated wallet profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericDataEnvelope' }

  /api/v1/wallet/assets:
    get:
      tags: [Wallets]
      summary: List Clipli-related HAPW assets observed for a wallet
      description: Read-only assets are source-stamped from an external asset platform. The wallet address is not an ownership proof by itself.
      operationId: listWalletAssets
      parameters:
        - $ref: '#/components/parameters/WalletAddress'
      responses:
        '200':
          description: Wallet asset snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletAssetListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/wallet/airdrop-eligibility:
    get:
      tags: [Wallets, Airdrops]
      summary: Evaluate whether a wallet satisfies an airdrop rule
      operationId: getWalletAirdropEligibility
      parameters:
        - $ref: '#/components/parameters/WalletAddress'
        - name: ruleCode
          in: query
          required: true
          schema: { type: string, examples: [hapw_redemption] }
        - name: assetId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Eligibility result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AirdropEligibility' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/airdrops:
    get:
      tags: [Airdrops]
      summary: List airdrop records for a wallet
      operationId: listAirdrops
      parameters:
        - name: address
          in: query
          required: false
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [queued, submitted, confirmed, failed] }
      responses:
        '200':
          description: Airdrop records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirdropListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/airdrop-rules:
    get:
      tags: [Airdrops]
      summary: List enabled and disabled airdrop rules
      operationId: listAirdropRules
      responses:
        '200':
          description: Airdrop rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirdropRuleListEnvelope' }

  /api/v1/admin/airdrops:
    get:
      tags: [Operations]
      summary: List airdrop records for operators
      security: [{ ClipliAdminKey: [] }]
      operationId: listAdminAirdrops
      parameters:
        - name: walletAddress
          in: query
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        - name: status
          in: query
          schema: { type: string, enum: [queued, submitted, confirmed, failed] }
      responses:
        '200':
          description: Operator airdrop records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirdropListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Operations]
      summary: Create a specified-wallet airdrop or rule-based airdrop
      security: [{ ClipliAdminKey: [] }]
      operationId: createAdminAirdrop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AirdropCreateRequest' }
      responses:
        '201':
          description: Airdrop task queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirdropEnvelope' }
        '200':
          description: Existing result returned for the same requestId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirdropEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/airdrop-rules:
    get:
      tags: [Operations]
      summary: List airdrop rules for operators
      security: [{ ClipliAdminKey: [] }]
      operationId: listAdminAirdropRules
      responses:
        '200':
          description: Operator airdrop rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirdropRuleListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/bnb-networks:
    get:
      tags: [Operations]
      summary: List BNB networks available to the airdrop console
      description: Both entries are simulation-only until the CLIP BEP-20 contract and executor are deployed.
      security: [{ ClipliAdminKey: [] }]
      operationId: listBNBNetworks
      responses:
        '200':
          description: BNB network configuration and simulation boundary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BNBNetworkListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/airdrops/{airdropId}/simulate:
    parameters:
      - name: airdropId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Operations]
      summary: Simulate a BNB airdrop confirmation
      description: Confirms the queued platform ledger entry and returns a simulated receipt. No contract call, RPC broadcast, or wallet signature is performed.
      security: [{ ClipliAdminKey: [] }]
      operationId: simulateAirdrop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AirdropSimulationRequest' }
      responses:
        '200':
          description: Simulated airdrop record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirdropEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/internal/airdrops/{airdropId}/result:
    parameters:
      - name: airdropId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Operations]
      summary: Record the external executor result for an airdrop
      security: [{ ClipliExecutorKey: [] }]
      operationId: updateAirdropResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AirdropResultRequest' }
      responses:
        '200':
          description: Updated airdrop record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirdropEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/clip/treasury:
    get:
      tags: [CLIP Treasury]
      summary: Get fixed supply, platform treasury and conservation state
      operationId: getCLIPTreasury
      responses:
        '200':
          description: One-time mint and centralized ledger snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CLIPTreasuryEnvelope' }

  /api/v1/clip/distribution-rules:
    get:
      tags: [CLIP Treasury]
      summary: List centralized CLIP distribution rules
      operationId: listCLIPDistributionRules
      responses:
        '200':
          description: Enabled and disabled distribution rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CLIPDistributionRuleListEnvelope' }

  /api/v1/clip/distributions:
    get:
      tags: [CLIP Treasury]
      summary: List centralized CLIP distribution records
      operationId: listCLIPDistributions
      parameters:
        - name: assetId
          in: query
          schema: { type: string }
        - name: requestId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: CLIP grant ledger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CLIPDistributionListEnvelope' }

  /api/v1/integrations/asset-requirements:
    get:
      tags: [Integrations]
      summary: Get the required upstream external asset API contract
      operationId: getExternalAssetRequirements
      responses:
        '200':
          description: Required provider endpoints, fields and normalization policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericDataEnvelope' }

  /api/v1/integrations/asset-sources:
    get:
      tags: [Integrations]
      summary: List external asset sources and sync state
      operationId: listExternalAssetSources
      responses:
        '200':
          description: External platform sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetSourceListEnvelope' }

  /api/v1/integrations/asset-sources/{sourceCode}:
    parameters:
      - name: sourceCode
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Integrations]
      summary: Get a single external asset source
      operationId: getExternalAssetSource
      responses:
        '200':
          description: Source status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetSourceEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/integrations/asset-sync-runs:
    get:
      tags: [Integrations]
      summary: List external asset synchronization runs
      operationId: listExternalAssetSyncRuns
      responses:
        '200':
          description: Synchronization audit records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetSyncRunListEnvelope' }

  /api/v1/integrations/platform/templates:
    get:
      tags: [Integrations]
      summary: Read the Haiwen copyright-template catalog
      operationId: listHaiwenTemplates
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: workId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Haiwen templates with Clipli mapping readiness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalTemplateListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/integrations/platform/users/{userId}/migrations/preview:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    post:
      tags: [Integrations]
      summary: Preview a Haiwen template-to-Clipli asset migration
      operationId: previewHaiwenAssetMigration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMigrationRequest' }
      responses:
        '200':
          description: Read-only migration preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalMigrationPreviewEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/integrations/platform/users/{userId}/migrations:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      tags: [Integrations]
      summary: List Haiwen-to-Clipli asset migrations for a user
      operationId: listHaiwenAssetMigrations
      responses:
        '200':
          description: Migration audit records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalMigrationListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Integrations]
      summary: Write off Haiwen assets and activate matching Clipli mirror assets
      description: Requires the configured operator credential. This is irreversible at Haiwen; after Haiwen accepts the write-off, Clipli activates and settles the matching mirror assets in the same migration, including Creation Credits and CLIP.
      operationId: migrateHaiwenAsset
      security:
        - ClipliAdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMigrationRequest' }
      responses:
        '201':
          description: Migration completed and Clipli assets activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalMigrationResultEnvelope' }
        '200':
          description: Existing migration returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalMigrationResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/generations:
    post:
      tags: [Creation]
      summary: Create an AI video job using a redeemed HAPW
      operationId: createGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerationRequest' }
      responses:
        '201':
          description: Generation created and balances charged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericDataEnvelope' }
        '200': { description: Existing idempotent result, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/conversions:
    post:
      tags: [Creation]
      summary: Create a regional license and charge the CLIP service fee
      operationId: createRegionalLicense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionRequest' }
      responses:
        '201': { description: License request submitted, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }
        '200': { description: Existing idempotent result, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/profile:
    get:
      tags: [Account]
      summary: Get the current profile and CLIP balance
      operationId: getProfile
      responses:
        '200': { description: Current profile, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }

  /api/profile/wallet:
    post:
      tags: [Account]
      summary: Compatibility alias for POST /api/v1/wallet/connect
      operationId: connectWallet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletConnectRequest' }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Account]
      summary: Compatibility alias for DELETE /api/v1/wallet/connect
      operationId: disconnectWallet
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }

  /api/profile/overseas:
    post:
      tags: [Account]
      summary: Bind a third-party account
      operationId: bindOverseasAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account: { type: string, minLength: 4, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Account]
      summary: Unbind the third-party account
      operationId: unbindOverseasAccount
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }

  /api/profile/settings:
    patch:
      tags: [Account]
      summary: Update account safety settings
      operationId: updateProfileSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletSign: { type: boolean }
                expiryReminder: { type: boolean }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/overview:
    get:
      tags: [Compatibility]
      summary: Get homepage aggregate data
      operationId: getOverview
      responses:
        '200': { description: Homepage data, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }

  /api/works:
    get:
      tags: [Compatibility]
      summary: List works
      operationId: listWorks
      responses:
        '200':
          description: Works
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Work' }

  /api/works/{workId}:
    parameters:
      - name: workId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Compatibility]
      summary: Get work detail
      operationId: getWork
      responses:
        '200': { description: Work, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/assets:
    get:
      tags: [Compatibility]
      summary: Get the current asset dashboard aggregate
      operationId: getAssetDashboard
      responses:
        '200': { description: Dashboard data, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }

  /api/studio:
    get:
      tags: [Compatibility]
      summary: Get AI studio HAPW, balance and job data
      operationId: getStudio
      responses:
        '200': { description: Studio data, content: { application/json: { schema: { $ref: '#/components/schemas/GenericDataEnvelope' } } } }

  /api/hapw/redemptions:
    post:
      deprecated: true
      tags: [Compatibility]
      summary: Compatibility alias for POST /api/v1/hapw/redemptions
      operationId: createHAPWRedemptionLegacy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RedemptionRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RedemptionResultEnvelope' } } } }
        '200': { description: Idempotent result, content: { application/json: { schema: { $ref: '#/components/schemas/RedemptionResultEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/exercises:
    post:
      deprecated: true
      tags: [Compatibility]
      summary: Compatibility alias for POST /api/v1/hapw/exercises
      operationId: createHAPWExerciseLegacy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseEnvelope' } } } }
        '200': { description: Idempotent result, content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/transfers:
    post:
      deprecated: true
      tags: [Compatibility]
      summary: Legacy naming alias; behavior is HAPW exercise
      operationId: createHAPWTransferAlias
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseEnvelope' } } } }
        '200': { description: Idempotent result, content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/clip/hapw-exchanges:
    post:
      deprecated: true
      tags: [Compatibility]
      summary: Compatibility alias for POST /api/v1/hapw/exchanges
      operationId: createHAPWExchangeLegacy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExchangeRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ExchangeResultEnvelope' } } } }
        '200': { description: Idempotent result, content: { application/json: { schema: { $ref: '#/components/schemas/ExchangeResultEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/integrations/platform/verification-codes:
    post:
      tags: [Integrations]
      summary: Ask the external platform to send a verification code
      operationId: sendExternalPlatformVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationCodeRequest' }
      responses:
        '202':
          description: Code delivery accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCodeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/integrations/platform/bindings:
    get:
      tags: [Integrations]
      summary: Get the current external-platform binding for a Clipli user
      operationId: getExternalPlatformBinding
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Current user binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Integrations]
      summary: Validate a code at the external platform and bind users
      operationId: bindExternalPlatformUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindingRequest' }
      responses:
        '201':
          description: Binding created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingEnvelope' }
        '200':
          description: Existing binding returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/integrations/platform/users/{userId}/assets:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      tags: [Integrations]
      summary: Query assets or template counts held by a bound Clipli user
      operationId: listExternalPlatformUserAssets
      parameters:
        - name: tplIds
          in: query
          required: false
          description: Comma-separated Haiwen template IDs. When present, the adapter calls the exact count endpoint.
          schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*){0,99}$' }
      responses:
        '200':
          description: External platform asset holdings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAssetsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/integrations/platform/users/{userId}/asset-counts:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
      - name: tplIds
        in: query
        required: true
        description: Comma-separated Haiwen template IDs, between 1 and 100 values.
        schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*){0,99}$' }
    get:
      tags: [Integrations]
      summary: Query exact redeemable asset counts by Haiwen template ID
      operationId: countExternalPlatformUserAssets
      responses:
        '200':
          description: External platform template counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAssetCountsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/integrations/platform/users/{userId}/assets/{assetId}/redemptions:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
      - name: assetId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
    post:
      tags: [Integrations]
      summary: Redeem an external asset with a unique serial number
      operationId: redeemExternalPlatformAsset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalRedemptionRequest' }
      responses:
        '201':
          description: External redemption completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalRedemptionEnvelope' }
        '200':
          description: Existing redemption returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalRedemptionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      description: Asset ID (`asset-2048`) or token ID (`#2048` or `2048`)
      schema: { type: string }
    AssetIdQuery:
      name: assetId
      in: query
      required: false
      schema: { type: string }
    WalletAddress:
      name: address
      in: query
      required: true
      description: EVM wallet address
      schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }

  responses:
    BadRequest:
      description: Request failed domain or JSON validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Daily HAPW exchange limit reached
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid operator/executor key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Required operator or executor configuration is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: The user is not bound or an idempotency key was reused
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  securitySchemes:
    ClipliAdminKey:
      type: apiKey
      in: header
      name: X-Clipli-Admin-Key
      description: Operator key configured by the Clipli deployment.
    ClipliExecutorKey:
      type: apiKey
      in: header
      name: X-Clipli-Executor-Key
      description: External airdrop executor callback key configured by the Clipli deployment.

  schemas:
    GenericDataEnvelope:
      type: object
      required: [data]
      properties:
        data: { type: object, additionalProperties: true }

    WalletConnectRequest:
      type: object
      additionalProperties: false
      required: [provider, address, chainId]
      properties:
        provider: { type: string, enum: [MetaMask, Coinbase Wallet, WalletConnect, Venly] }
        address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        chainId: { type: string, enum: ['0x61', '0x38', '97', '56'], description: BNB Smart Chain Testnet or Mainnet. }

    WalletAsset:
      type: object
      required: [id, walletAddress, assetId, tokenId, name, balance, standard, sourceCode, externalAssetId, syncStatus, lastSyncedAt, canRedeem, canExercise]
      properties:
        id: { type: string }
        walletAddress: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        assetId: { type: string }
        tokenId: { type: string }
        name: { type: string }
        balance: { type: string }
        standard: { type: string, examples: [HAPW-1] }
        sourceCode: { type: string }
        externalAssetId: { type: string }
        externalUrl: { type: string, format: uri }
        syncStatus: { type: string, enum: [synced, stale, failed, pending-write-off, external_write_off_failed, reconciliation_required, migrated] }
        lastSyncedAt: { type: string, format: date-time }
        redemptionStatus: { type: string, enum: [available, redeemed, restricted, pending_external_write_off, external_write_off_failed, reconciliation_required] }
        canRedeem: { type: boolean }
        canExercise: { type: boolean }

    WalletAssetListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [walletAddress, items, totalItems, sourceOfTruth]
          properties:
            walletAddress: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
            items:
              type: array
              items: { $ref: '#/components/schemas/WalletAsset' }
            totalItems: { type: integer, minimum: 0 }
            sourceOfTruth: { type: string, const: external-platform }

    AirdropRule:
      type: object
      required: [code, name, trigger, formula, token, enabled, requiresWallet, description]
      properties:
        code: { type: string }
        name: { type: string }
        trigger: { type: string }
        formula: { type: string }
        token: { type: string, const: CLIP }
        enabled: { type: boolean }
        requiresWallet: { type: boolean }
        description: { type: string }

    AirdropRuleListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, totalItems]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AirdropRule' }
            totalItems: { type: integer, minimum: 0 }

    AirdropEligibility:
      type: object
      required: [ruleCode, walletAddress, token, eligible, reason]
      properties:
        ruleCode: { type: string }
        walletAddress: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        assetId: { type: string }
        token: { type: string, const: CLIP }
        amount: { type: integer, minimum: 0 }
        eligible: { type: boolean }
        reason: { type: string }
        existingId: { type: string }

    AirdropRecord:
      type: object
      required: [id, requestId, ruleCode, walletAddress, chainId, token, amount, status, eligibility, executionMode, allocationSource, createdAt, updatedAt]
      properties:
        id: { type: string }
        requestId: { type: string }
        ruleCode: { type: string }
        walletAddress: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        chainId: { type: string }
        assetId: { type: string }
        token: { type: string, const: CLIP }
        amount: { type: integer, minimum: 1 }
        status: { type: string, enum: [queued, submitted, confirmed, failed] }
        eligibility: { type: string, enum: [eligible] }
        executionMode: { type: string, enum: [external-executor, simulated-bnb] }
        network: { type: string, enum: ['0x61', '0x38'] }
        simulated: { type: boolean, description: True when the record was confirmed by the local simulator rather than a blockchain transaction. }
        allocationSource: { type: string, enum: [redemption-entitlement, treasury-reservation] }
        executorRef: { type: string }
        txHash: { type: string }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AirdropListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, totalItems]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AirdropRecord' }
            totalItems: { type: integer, minimum: 0 }

    AirdropEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AirdropRecord' }

    AirdropCreateRequest:
      type: object
      additionalProperties: false
      required: [requestId, ruleCode, walletAddress, chainId]
      properties:
        requestId: { type: string, minLength: 8, maxLength: 100 }
        ruleCode: { type: string, enum: [hapw_redemption, admin_approved] }
        walletAddress: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        chainId: { type: string, enum: ['0x61', '0x38', '97', '56'], description: BNB Smart Chain Testnet (0x61/97) or Mainnet (0x38/56). }
        assetId: { type: string }
        amount: { type: integer, minimum: 1, description: Required for admin_approved; derived from redemption for hapw_redemption. }
        token: { type: string, const: CLIP }

    AirdropResultRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [submitted, confirmed, failed] }
        txHash: { type: string }
        executorRef: { type: string }
        failureReason: { type: string }

    BNBNetwork:
      type: object
      required: [chainId, name, network, nativeCurrency, contractDeployed, simulationOnly]
      properties:
        chainId: { type: string, enum: ['0x61', '0x38'] }
        name: { type: string }
        network: { type: string, enum: [testnet, mainnet] }
        nativeCurrency: { type: string, enum: [tBNB, BNB] }
        contractDeployed: { type: boolean, const: false }
        simulationOnly: { type: boolean, const: true }

    BNBNetworkListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, contractDeployed, simulationOnly, note]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/BNBNetwork' }
            contractDeployed: { type: boolean, const: false }
            simulationOnly: { type: boolean, const: true }
            note: { type: string }

    AirdropSimulationRequest:
      type: object
      additionalProperties: false
      required: [chainId]
      properties:
        chainId: { type: string, enum: ['0x61', '0x38', '97', '56'] }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    LocalizedText:
      type: object
      required: [zh, en]
      properties:
        zh: { type: string }
        en: { type: string }
        es: { type: string }
        ja: { type: string }
        fr: { type: string }
        ko: { type: string }

    Authorization:
      type: object
      required: [holder, scope, territories, usageTypes, exclusivity, commercialUse, derivativeWorks, aiTraining, sublicensable, validFrom]
      properties:
        holder: { $ref: '#/components/schemas/LocalizedText' }
        scope: { $ref: '#/components/schemas/LocalizedText' }
        territories:
          type: array
          items: { type: string }
        usageTypes:
          type: array
          items: { type: string, enum: [ai-video, short-video, digital-display] }
        exclusivity: { type: string, enum: [exclusive, non-exclusive] }
        commercialUse: { type: boolean }
        derivativeWorks: { type: boolean }
        aiTraining: { type: boolean }
        sublicensable: { type: boolean }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date }

    Provenance:
      type: object
      required: [issuer, certificateId, network, tokenStandard, verificationStatus, issuedAt]
      properties:
        issuer: { type: string }
        certificateId: { type: string }
        network: { type: string }
        tokenStandard: { type: string }
        contractAddress: { type: string }
        metadataUri: { type: string, format: uri }
        verificationStatus:
          type: string
          description: Verification state reported by the source platform or Clipli policy
        issuedAt: { type: string, format: date }

    AssetMedia:
      type: object
      required: [linkedWorkIds, format]
      properties:
        linkedWorkIds:
          type: array
          items: { type: string }
        format: { type: string }
        previewUrl: { type: string, format: uri }

    ExternalAssetRef:
      type: object
      required: [providerCode, providerAssetId, syncStatus, lastSyncedAt]
      properties:
        providerCode: { type: string }
        providerAssetId: { type: string }
        assetUrl: { type: string, format: uri }
        syncStatus: { type: string, enum: [synced, stale, failed, pending-write-off, external_write_off_failed, reconciliation_required, migrated] }
        lastSyncedAt: { type: string, format: date-time }
        dataVersion: { type: string }

    HAPWAsset:
      type: object
      required: [id, kind, tokenId, name, nameEn, value, currency, status, statusEn, transferable, owner, rightsHolder, rightsHolderEn, authorizationScope, authorizationScopeEn, creditYield, clipPrice, exchangeAvailable, redemptionStatus, authorization, provenance, media, external]
      properties:
        id: { type: string, examples: [asset-2048] }
